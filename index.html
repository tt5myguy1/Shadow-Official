<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow [ALPHA]</title>

<style>
:root {
  --bg1:#0f2027;
  --bg2:#203a43;
  --bg3:#2c5364;
  --card:#ffffff;
  --accent:#4aa3ff;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family: Arial, sans-serif;
  min-height:100vh;
  background: linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== TOP BAR ===== */
.topbar {
  position:sticky;
  top:15px;
  width:92%;
  max-width:1100px;
  background:rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  border-radius:30px;
  padding:14px 22px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.nav-icon {
  width:28px;
  height:28px;
  cursor:pointer;
  filter:brightness(0) invert(1);
  transition:0.2s;
}
.nav-icon:hover { transform:scale(1.2); }

/* ===== HEADER ===== */
.header {
  text-align:center;
  margin-bottom:25px;
}
.header h1 {
  font-size:3rem;
  margin:10px 0;
}
.header p {
  opacity:0.85;
  margin:4px 0;
}

/* ===== PAGES ===== */
.page {
  display:none;
  width:92%;
  max-width:1100px;
}
.page.active { display:block; }

/* ===== GAME GRID ===== */
.game-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:25px;
}

.game-card {
  background:var(--card);
  color:black;
  border-radius:26px;
  padding:18px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  transition:0.25s;
}
.game-card:hover {
  transform:translateY(-6px) scale(1.03);
}

.game-icon {
  width:90px;
  height:90px;
  border-radius:24px;
  border:3px solid var(--accent);
  margin:0 auto 10px;
  overflow:hidden;
}
.icon-img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.game-title {
  font-weight:bold;
  font-size:0.95rem;
}

/* ===== VIDEOS ===== */
.video-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.video-card {
  background:white;
  border-radius:24px;
  padding:15px;
  color:black;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}
.video-title {
  margin-top:8px;
  font-weight:bold;
}

/* ===== MORE BUTTONS ===== */
.more-wrap {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px;
}

.more-btn {
  padding:18px 28px;
  font-size:1.2rem;
  border:none;
  border-radius:26px;
  cursor:pointer;
  background:white;
  color:black;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  transition:0.25s;
}

/* ===== OVERLAY ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.overlay.hidden {
  display: none;
}

.overlay-box {
  background: rgba(255,255,255,0.95);
  color: black;
  width: 80%;
  max-width: 900px;
  max-height: 80vh;
  border-radius: 30px;
  padding: 30px;
  position: relative;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  border: 3px solid var(--accent);
  display: flex;
  flex-direction: column;
}

.close-btn {
  position: absolute;
  top: 18px;
  right: 22px;
  background: none;
  border: none;
  font-size: 1.8rem;
  cursor: pointer;
}

/* ===== LINKS GRID ===== */
.links-grid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  overflow-y: auto;
  padding-right: 10px;
}

.link-item {
  font-size: 1rem;
}

.link-item a {
  color: #1e6bff;
  text-decoration: underline;
  font-weight: 600;
}
.more-btn:hover { transform:scale(1.08); }

/* ===== TOAST NOTIFICATIONS ===== */
#toastContainer {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 1000;
}

.toast {
  background: rgba(0, 0, 0, 0.85);
  color: white;
  padding: 14px 18px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1rem;
  box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  animation: toastIn 0.35s ease forwards;
}

/* Red outlined exclamation */
.toast-icon {
  width: 22px;
  height: 22px;
  border: 2px solid red;
  border-radius: 50%;
  color: red;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.toast.fade-out {
  animation: toastOut 0.4s ease forwards;
}

@keyframes toastOut {
  from {
    opacity: 1;
    transform: translateY(0);
  }
  to {
    opacity: 0;
    transform: translateY(20px);
  }
}

</style>
</head>

<body>

function loadGames(){
  const grid=document.getElementById('gameGrid');
  grid.innerHTML='';
  games.forEach(g=>{
    const card=document.createElement('div');
    card.className='game-card';
    card.onclick=()=>location.href=g.link;
    card.innerHTML=`
      <div class="game-icon"><img src="${g.img}" class="icon-img"></div>
      <div class="game-title">${g.name}</div>
    `;
    grid.appendChild(card);
  });
}
loadGames();

// ===== VIDEOS =====
const videos = [
  { title:"Video 1 that I'm gonna add soon", file:"v/video1.mp4", thumbnail:"images/video1.png" },
  { title:"and uhhh video 2", file:"v/video2.mp4", thumbnail:"images/video2.png" }
];

function loadVideos(){
  const grid=document.getElementById('videoGrid');
  grid.innerHTML='';
  videos.forEach(v=>{
    const card=document.createElement('div');
    card.className='video-card';
    card.innerHTML=`
      <video width="100%" controls poster="${v.thumbnail}">
        <source src="${v.file}" type="video/mp4">
      </video>
      <div class="video-title">${v.title}</div>
    `;
    grid.appendChild(card);
  });
}

// ===== LINKS DATA =====
const links = [
  { text: "Main Website (Vercel)", url: "https://shadowwebsite-official.vercel.app" },
];

function openLinks() {
  const grid = document.getElementById("linksGrid");
  grid.innerHTML = "";

  links.forEach(l => {
    const div = document.createElement("div");
    div.className = "link-item";
    div.innerHTML = `<a href="${l.url}" target="_blank">${l.text}</a>`;
    grid.appendChild(div);
  });

  document.getElementById("linksOverlay").classList.remove("hidden");
}

function closeLinks() {
  document.getElementById("linksOverlay").classList.add("hidden");
}

function showToast(message) {
  const container = document.getElementById("toastContainer");

  const toast = document.createElement("div");
  toast.className = "toast";

  toast.innerHTML = `
    <div class="toast-icon">!</div>
    <div>${message}</div>
  `;

  container.appendChild(toast);

  // Auto remove after 3 seconds
  setTimeout(() => {
    toast.classList.add("fade-out");
    setTimeout(() => toast.remove(), 400);
  }, 3000);
}
