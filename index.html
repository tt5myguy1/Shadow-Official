<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow [ALPHA]</title>
  <style>
    body { font-family: Arial, sans-serif; background: #717171; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { color: #000000; font-size: 3rem; margin-bottom: 30px; }

    .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 25px; width: 90%; max-width: 900px; }
    .game-card { background: white; border-radius: 25px; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; cursor: pointer; }
    .game-card:hover { transform: scale(1.05); }
    .game-icon { width: 80px; height: 80px; border-radius: 25px; border: 3px solid #000000; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .icon-img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
    .game-title { font-size: 1rem; color: #000000; font-weight: bold; }

    .topbar { width: 90%; max-width: 900px; background: #3B3B3B; padding: 12px 20px; border-radius: 25px; display: flex; justify-content: space-around; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .nav-icon { width: 28px; height: 28px; cursor: pointer; filter: brightness(0) invert(1); transition: 0.2s; }
    .nav-icon:hover { transform: scale(1.15); }

    .more-btn { width: 200px; padding: 15px; margin: 10px; background:#3D3D3D; color:black; border:none; font-size:1.2rem; border-radius:20px; cursor:pointer; transition:0.2s; }
    .more-btn:hover { transform: scale(1.08); }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .video-card { background:white; border-radius:20px; padding:15px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.1); cursor:pointer; transition:0.2s; }
    .video-card:hover { transform: scale(1.05); }
    .video-thumb { width:100%; border-radius:15px; margin-bottom:10px; }
    .video-title { font-size:1rem; color:#000000; font-weight:bold; }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="topbar">
    <img src="images/Icons/Bar/Controller.png" class="nav-icon" />
    <img src="images/Icons/Bar/TV.jpg" class="nav-icon" />
    <img src="images/Icons/Bar/Internet.png" class="nav-icon" />
    <img src="images/Icons/Bar/Plus.webp" class="nav-icon" />
  </div>

  <h1>Shadow [ALPHA]</h1>
  <h3>V0.1.1</h3>

  <!-- Game Section -->
  <div class="game-grid" id="gameGrid"></div>

  <!-- Video Section -->
  <div id="videoSection" style="display:none; width:90%; max-width:900px; text-align:center;">
    <h1 style="color:#000000;">Videos</h1>
    <div id="videoGrid" class="video-grid"></div>
  </div>

  <!-- Internet Coming Soon Section -->
  <div id="internetSection" style="display:none; width:90%; max-width:900px; text-align:center;">
    <h1 style="color:#000000; font-size:3rem; margin-top:40px;">COMING SOON!</h1>
  </div>

  <!-- More Menu Section -->
  <div id="moreSection" style="display:none; width:90%; max-width:900px; text-align:center; margin-top:30px;">
    <button class="more-btn">Links</button>
    <button class="more-btn">Discord</button>
    <button class="more-btn">Extra</button>
    <button class="more-btn">Online Chat</button>
  </div>

  <script>
    // --- Games Data ---
    const games = [
      { name: "Baldi's Basics Plus", img: "images/BaldisBasicsPlus.webp", link: "g/BaldisBasicsPlus.html" },
      { name: "BLOODMONEY", img: "images/bloodmoney.webp", link: "g/BLOODMONEY!.html" },
      { name: "Bad Parenting", img: "images/BpTB.webp", link: "g/Bad Parenting 1.html" },
      { name: "Basket Battle", img: "images/basketbattles.png", link: "g/Basket Battle.html" },
      { name: "Bendy and the Ink Machine", img: "images/Bendy.jpg", link: "g/Bendy and the Ink Machine.html" },
      { name: "BitLife", img: "images/blife.webp", link: "g/B1tLife.html" },
      { name: "Buckshot Roulette", img: "images/blife.webp", link: "g/Buckshot Roulette.html" },
      { name: "Crazy Cars", img: "images/crazycars.webp", link: "g/Crazy Cars.html" },
      { name: "Cuphead", img: "images/cuphead.jpg", link: "g/Cuphead.html" },
      { name: "FNF VS IMPOSTER V4", img: "images/FNFVSIMPOSTERV4.jpg", link: "g/Friday Night Funkin VS Impostor v4.html" },
      { name: "FNF VS Hit Single Real", img: "images/HitSingleReal.png", link: "g/Friday Night Funkin'_ Hit Single Real.html" },
      { name: "FNF VS Tricky", img: "images/Tricky.jpg", link: "g/Friday Night Funkin'_ vs. Tricky.html" },
      { name: "Friday Night Funkin'", img: "images/FNF.webp", link: "g/Friday Night Funkin.html" },
      { name: "Getting Over It", img: "images/GettingOverIt.webp", link: "g/Getting Over It with Bennett Foddy.html" },
      { name: "Google Fued", img: "images/GoogleFued.jpg", link: "g/Google Fued.html" },
      { name: "Hollow Knight", img: "images/HallowNight.jpg", link: "g/Hollow Knight.html" },
      { name: "Kindergarden", img: "images/Kindergarden.jpg", link: "g/Kindergarten.html" },
      { name: "Kindergarden 2", img: "images/Kindergarden2.jpg", link: "g/Kindergarten 2.html" },
      { name: "Kindergarden 3", img: "images/Kindergarden3.webp", link: "g/Kindergarten 3.html" },
      { name: "Learn to fly", img: "images/LearnToFly.jpg", link: "g/Learn to Fly.html" },
      { name: "Learn to fly 2", img: "images/LearnToFly2.jpg", link: "g/Learn to Fly 2.html" },
      { name: "Learn to fly 3", img: "images/LearnToFly3.png", link: "g/Learn to Fly 3.html" },
      { name: "Minecraft 1.12.2", img: "images/mc.png", link: "g/Minecraft 1.12.2.html" },
      { name: "Minecraft 1.21.4", img: "images/mc.png", link: "g/Minecraft 1.21.4.html" },
      { name: "Moto X3M", img: "images/motoxm.jpg", link: "g/Moto X3M.html" },
      { name: "Moto X3M 2", img: "images/motoxm2.jpg", link: "g/Moto X3M 2.html" },
      { name: "Moto X3M 3", img: "images/motoxm3.jpg", link: "g/Moto X3M 3.html" },
      { name: "Moto X3M Pool Party", img: "images/motoxmpoolparty.webp", link: "g/Moto X3M Pool Party.html" },
      { name: "Moto X3M Winter", img: "images/motoxmwinter.jpg", link: "g/Moto X3M Winter.html" },
      { name: "Moto X3M Spooky", img: "images/motoxmspooky.png", link: "g/Moto X3M Spooky.html" },
    ];

    function loadGames() {
      const grid = document.getElementById("gameGrid");
      grid.innerHTML = "";
      games.forEach(g => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.onclick = () => window.location.href = g.link;
        card.innerHTML = `<div class='game-icon'><img src="${g.img}" class="icon-img" /></div><div class='game-title'>${g.name}</div>`;
        grid.appendChild(card);
      });
    }

    loadGames();

    // --- Sections Handling ---
    const sections = {
      games: document.getElementById('gameGrid'),
      videos: document.getElementById('videoSection'),
      internet: document.getElementById('internetSection'),
      more: document.getElementById('moreSection')
    };

    function showSection(name) {
      Object.values(sections).forEach(sec => sec.style.display = 'none');
      sections[name].style.display = 'block';
      if(name === 'videos') loadVideos();
    }

    const navIcons = document.querySelectorAll('.nav-icon');
    navIcons[0].onclick = () => showSection('games');
    navIcons[1].onclick = () => showSection('videos');
    navIcons[2].onclick = () => showSection('internet');
    navIcons[3].onclick = () => showSection('more');

    // --- Videos Auto Load ---
    const videos = [
      { title: "Sample Video 1", file: "v/video1.mp4", thumbnail: "images/video1.png" },
      { title: "Sample Video 2", file: "v/video2.mp4", thumbnail: "images/video2.png" }
    ];

    function loadVideos() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `<video width='100%' controls poster='${v.thumbnail}'><source src='${v.file}' type='video/mp4'></video><div class='video-title'>${v.title}</div>`;
        grid.appendChild(card);
      });
    }
  </script>

</body>
</html>
