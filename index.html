<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f2ff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #1e6bff;
      font-size: 3rem;
      margin-bottom: 30px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 25px;
      width: 90%;
      max-width: 900px;
    }

    .game-card {
      background: white;
      border-radius: 25px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.2s;
      cursor: pointer;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-icon {
      width: 80px;
      height: 80px;
      border-radius: 25px;
      border: 3px solid #1e6bff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .game-title {
      font-size: 1rem;
      color: #003d99;
      font-weight: bold;
    }
  .topbar {
      width: 90%;
      max-width: 900px;
      background: #1e6bff;
      padding: 12px 20px;
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .nav-icon {
      width: 28px;
      height: 28px;
      cursor: pointer;
      filter: brightness(0) invert(1);
      transition: 0.2s;
    }

    .nav-icon:hover {
      transform: scale(1.15);
    }

  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="topbar">
    <img src="images/Icons/Bar/Controller.png" class="nav-icon" />
    <img src="images/Icons/Bar/TV.jpg" class="nav-icon" />
    <img src="images/Icons/Bar/Internet.png" class="nav-icon" />
    <img src="images/Icons/Bar/Plus.webp" class="nav-icon" />
  </div>

  <h1>Game Hub</h1>
  <h3>I do not own any games, or videos on this website. Every game is made by gn-math. Videos are made by YouTubers on youtuber. I am not responsible if you get in trouble by your teacher while using this website.</h3>

  <div class="game-grid" id="gameGrid">
    <!-- Games auto-generated here -->
  </div>

  <script>
    const games = [
      { name: "Baldi's Basics Plus", img: "images/BaldisBasicsPlus.webp", link: "g/BaldisBasicsPlus.html" },
      { name: "BLOODMONEY", img: "images/bloodmoney.webp", link: "g/BLOODMONEY!.html" },
      { name: "Bad Parenting", img: "images/BpTB.webp", link: "g/Bad Parenting 1.html" },
      { name: "Basket Battle", img: "images/basketbattles.png", link: "g/Basket Battle.html" },
      { name: "Bendy and the Ink Machine", img: "images/Bendy.jpg", link: "g/Bendy and the Ink Machine.html" },
      { name: "BitLife", img: "images/blife.webp", link: "g/B1tLife.html" },
      { name: "Buckshot Roulette", img: "images/blife.webp", link: "g/Buckshot Roulette.html" },
      { name: "Crazy Cars", img: "images/crazycars.webp", link: "g/Crazy Cars.html" },
      { name: "Cuphead", img: "images/cuphead.jpg", link: "g/Cuphead.html" },
      { name: "FNF VS IMPOSTER V4", img: "images/FNFVSIMPOSTERV4.jpg", link: "g/Friday Night Funkin VS Impostor v4.html" },
      { name: "FNF VS Hit Single Real", img: "images/HitSingleReal.png", link: "g/Friday Night Funkin'_ Hit Single Real.html" },
      { name: "FNF VS Tricky", img: "images/Tricky.jpg", link: "g/Friday Night Funkin'_ vs. Tricky.html" },
      { name: "Friday Night Funkin'", img: "images/FNF.webp", link: "g/Friday Night Funkin.html" },
      { name: "Getting Over It", img: "images/GettingOverIt.webp", link: "g/Getting Over It with Bennett Foddy.html" },
      { name: "Google Fued", img: "images/GoogleFued.jpg", link: "g/Google Fued.html" },
      { name: "Hollow Knight", img: "images/HallowNight.jpg", link: "g/Hollow Knight.html" },
      { name: "Kindergarden", img: "images/Kindergarden.jpg", link: "g/Kindergarten.html" },
      { name: "Kindergarden 2", img: "images/Kindergarden2.jpg", link: "g/Kindergarten 2.html" },
      { name: "Kindergarden 3", img: "images/Kindergarden3.webp", link: "g/Kindergarten 3.html" },
      { name: "Learn to fly", img: "images/LearnToFly.jpg", link: "g/Learn to Fly.html" },
      { name: "Learn to fly 2", img: "images/LearnToFly2.jpg", link: "g/Learn to Fly 2.html" },
      { name: "Learn to fly 3", img: "images/LearnToFly3.png", link: "g/Learn to Fly 3.html" },
      { name: "Minecraft 1.12.2", img: "images/mc.png", link: "g/Minecraft 1.12.2.html" },
      { name: "Minecraft 1.21.4", img: "images/mc.png", link: "g/Minecraft 1.21.4.html" },
    ];

    function loadGames() {
      const grid = document.getElementById("gameGrid");
      grid.innerHTML = "";

      games.forEach(g => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.onclick = () => window.location.href = g.link;

        card.innerHTML = `
          <div class='game-icon'><img src="${g.img}" class="icon-img" /></div>
          <div class='game-title'>${g.name}</div>
        `;

        grid.appendChild(card);
      });
    }

    loadGames();
  </script>
</body>
</html>
